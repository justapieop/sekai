volumes:
  postgres_data:
  seaweed_data:

networks:
  fiber:
    driver: bridge

services:
  postgres:
    image: 'dhi.io/postgres:18.3-alpine3.22'
    restart: always
    networks:
      - fiber
    environment:
      - POSTGRES_DB=sekai
      - POSTGRES_USER=sekai_db_user
      - POSTGRES_PASSWORD=sekai_db_password
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrator:
    build:
      context: .
      dockerfile: docker/migrator/Dockerfile
    env_file:
      - .env
    networks:
      - fiber

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: always
    env_file:
      - .env
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

